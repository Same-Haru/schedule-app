<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スケジュール管理</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>

    <h1>📅 スケジュール管理</h1>

    <div class="header-buttons">

         <button
            class="menu-button"
            onclick="showSetupPanel()">
            ⚙️
        </button>

        <button
            class="menu-button"
            onclick="toggleEventForm()">
            ＋
        </button>



    </div>

</header>

<div id="setupPanel" class="settings">

    <label>
        開始日
        <input type="date" id="startDate">
    </label>

    <label>
        日数
        <input type="number" id="days" value="2" min="1" max="7">
    </label>

    <label>
        開始時間
        <input type="time" id="startTime" value="09:00">
    </label>

    <label>
        終了時間
        <input type="time" id="endTime" value="21:00">
    </label>

    <button onclick="createNewSchedule()">
        スケジュール作成
    </button>

</div>

<div id="eventForm"
         class="event-form hidden">

    <input type="text"
           id="eventTitle"
           placeholder="予定名">

    <select id="eventDate"></select>

    <div class="time-label">
        開始時間
    </div>

  <div class="time-block">

    <div class="time-label">
        開始時間
    </div>

    <div class="time-select-row">

        <select id="eventStartHour"></select>

        <span>：</span>

        <select id="eventStartMinute"></select>

    </div>

</div>

<div class="time-block">

    <div class="time-label">
        終了時間
    </div>

    <div class="time-select-row">

        <select id="eventEndHour"></select>

        <span>：</span>

        <select id="eventEndMinute"></select>

    </div>

</div>
    

<input
    type="text"
    id="eventEnd"
    list="timeOptions">

    <select id="eventColor">
        <option value="#F8C8DC">🩷 ピンク</option>
        <option value="#FFD6A5">🧡 オレンジ</option>
        <option value="#FFF3B0">💛 イエロー</option>
        <option value="#CDEAC0">💚 グリーン</option>
        <option value="#B8F2E6">🩵 ミント</option>
        <option value="#A9DEF9">🩵 ブルー</option>
        <option value="#D0BDF4">💜 ラベンダー</option>
        <option value="#E5E5E5">🩶 グレー</option>
    </select>

    <button onclick="saveEvent()">
        登録
    </button>

</div>

<div id="mobileDayNav" class="mobile-day-nav">

    <button onclick="prevDay()">
        ◀
    </button>

    <span id="mobileDayTitle">
    </span>

    <button onclick="nextDay()">
        ▶
    </button>

</div>

<div id="scheduleContainer"></div>

<script src="script.js"></script>

<div id="editModal" class="modal hidden">

    <div class="modal-content">

        <h3>予定編集</h3>

        <input
            type="text"
            id="editTitle">
    <div class="time-label">
        開始時間
    </div>

    <div class="time-block">

    <div class="time-label">
        開始時間
    </div>

    <div class="time-select-row">

        <select id="editStartHour"></select>

        <span>：</span>

        <select id="editStartMinute"></select>

    </div>

</div>

<div class="time-block">

    <div class="time-label">
        終了時間
    </div>

    <div class="time-select-row">

        <select id="editEndHour"></select>

        <span>：</span>

        <select id="editEndMinute"></select>

    </div>

</div>

        <select id="editColor">

            <option value="#F8C8DC">🩷 ピンク</option>
            <option value="#FFD6A5">🧡 オレンジ</option>
            <option value="#FFF3B0">💛 イエロー</option>
            <option value="#CDEAC0">💚 グリーン</option>
            <option value="#B8F2E6">🩵 ミント</option>
            <option value="#A9DEF9">💙 ブルー</option>
            <option value="#D0BDF4">💜 ラベンダー</option>
            <option value="#E5E5E5">🩶 グレー</option>

        </select>

        <div class="modal-buttons">

            <button onclick="saveEdit()">
                保存
            </button>

            <button onclick="deleteEvent()">
                削除
            </button>

            <button onclick="closeModal()">
                閉じる
            </button>

        </div>

    </div>

</div>

<datalist id="timeOptions"></datalist>

</body>
</html>
